<!DOCTYPE html>
<!-- The README's banner, docs/banner.png. Rendered at 1600 by 400:
     firefox --headless --window-size 1600,400 --screenshot docs/banner.png scripts/banner.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1600px; height: 400px; overflow: hidden; }
  body { background: #fbfaf6; color: #1d1b16; border-left: 12px solid #1f3a6d;
         box-sizing: border-box; display: flex; align-items: center;
         font-family: "Source Serif 4", Georgia, serif; }
  .text { flex: 1; padding: 0 40px 0 84px; }
  .eyebrow { font: 600 17px/1 "IBM Plex Mono", monospace; letter-spacing: 0.14em;
             color: #1f3a6d; text-transform: uppercase; margin: 0 0 22px; }
  h1 { font-weight: 600; font-size: 44px; line-height: 1.12; letter-spacing: -0.015em;
       margin: 0 0 18px; }
  p { font-size: 24px; line-height: 1.4; margin: 0; color: #3a362d; }
  p b { color: #1d1b16; }
  .go { flex: none; width: 380px; margin-right: 80px; text-align: center; }
  .btn { display: block; background: #1f3a6d; color: #fff; border-radius: 6px;
         font: 600 27px/1 Inter, sans-serif; padding: 24px 0; }
  .sub { font: 500 17px/1 Inter, sans-serif; color: #5b574e; margin-top: 14px; }
</style>
</head>
<body>
  <div class="text">
    <div class="eyebrow">sramforge &middot; project page</div>
    <h1>A memory compiler for a 7&nbsp;nanometre process.</h1>
    <p>A 2 kilobyte block at <b>1.94 gigahertz</b>, with all <b>114,454 transistors</b> accounted for.</p>
  </div>
  <div class="go">
    <span class="btn">Read the walkthrough &rarr;</span>
    <div class="sub">6 sections &middot; interactive configurator</div>
  </div>
</body>
</html>
