<!DOCTYPE html>
<!-- The README banner, 1200 by 300: the project's headline beside a screenshot
     of the walkthrough's configurator (configurator.png), linking to the live
     site. Rendered at twice its size, from the repository root:
       firefox --headless --window-size 2400,600 --screenshot docs/banner.png docs/banner/banner.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #ece8de; --grid: #e0dacc; --sheet: #fbfaf6; --rule: #c9c3b4;
    --ink: #1d1b16; --muted: #5b574e; --navy: #1f3a6d;
    --mark: rgba(201, 151, 40, 0.32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { zoom: 2; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body {
    background-color: var(--desk);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: "Source Serif 4", Georgia, serif; color: var(--ink); position: relative;
  }
  .left { position: absolute; left: 60px; top: 30px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 40px; height: 40px; flex: none; }
  .brand .name { font-size: 24px; font-weight: 700; line-height: 1.05; }
  .brand .line { font: 500 12px/1.4 "IBM Plex Mono", monospace; letter-spacing: 0.1em;
                 text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  h1 { margin-top: 16px; font-size: 40px; font-weight: 700; line-height: 1.08;
       letter-spacing: -0.02em; }
  h1 .mark { background: linear-gradient(transparent 60%, var(--mark) 60%, var(--mark) 92%, transparent 92%); }
  .tagline { margin-top: 8px; font-size: 17px; line-height: 1.45; color: var(--muted); width: 500px; }
  .cta { position: absolute; left: 60px; bottom: 30px; display: flex; align-items: center; gap: 18px; }
  .button { background: var(--navy); color: #fff; font: 700 18px/1 Inter, sans-serif;
            padding: 11px 18px; border-radius: 8px; box-shadow: 4px 4px 0 var(--ink); }
  .window { position: absolute; right: 60px; top: 36px; width: 500px;
            background: var(--sheet); border: 2px solid var(--ink); border-radius: 10px;
            overflow: hidden; box-shadow: 8px 8px 0 var(--ink); }
  .bar { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px;
         border-bottom: 1.5px solid var(--rule); background: #f3f0e8; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #d3cdbf; }
  .bar span { margin-left: 10px; font: 500 11px/1 "IBM Plex Mono", monospace; color: var(--muted); }
  .window img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <!-- a block of memory cells, one of them picked out -->
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="6" fill="#fbfaf6" stroke="#1d1b16" stroke-width="2"/>
        <g fill="#c3cde4">
          <rect x="7" y="7" width="6" height="11"/><rect x="15" y="7" width="6" height="11"/>
          <rect x="27" y="7" width="6" height="11"/>
          <rect x="7" y="22" width="6" height="11"/><rect x="15" y="22" width="6" height="11"/>
          <rect x="27" y="22" width="6" height="11"/>
        </g>
        <rect x="23" y="7" width="2" height="26" fill="#8fb8a6"/>
        <rect x="15" y="7" width="6" height="11" fill="#d6a23a"/>
      </svg>
      <div>
        <div class="name">sramforge</div>
        <div class="line">Release 0.1</div>
      </div>
    </div>
    <h1>A memory compiler for a <span class="mark">7&nbsp;nanometre</span> process</h1>
    <p class="tagline">Checked from every shape to data stored in time.</p>
  </div>
  <div class="cta">
    <span class="button">Read the walkthrough &rarr;</span>
  </div>
  <div class="window">
    <div class="bar"><i></i><i></i><i></i><span>samcooper01.github.io/Open-SRAM-Compiler-ASAP7nmPDK</span></div>
    <img src="configurator.png" alt="">
  </div>
</body>
</html>
