<!DOCTYPE html>
<!-- The repository's social preview, 1280 by 640: the size GitHub asks for under Settings,
     General, Social preview, and the card shown anywhere the repository is linked. Unlike
     the README banner this one leads with the silicon: a generated 8 kilobyte bank, bled
     edge to edge along the bottom at a size it stays sharp. Render it from this directory:
       chromium --headless --window-size=1280,640 --force-device-scale-factor=1 \
         --virtual-time-budget=6000 --screenshot=social.png social.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #07060a;          /* the layout's own background, so the band has no seam */
    --text: #f6f3ec;
    --muted: #a39d92;
    --gold: #e0a93a;
    --line: #2a2731;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { background: var(--ink); color: var(--text); position: relative;
         font-family: "Source Serif 4", Georgia, serif; }

  .top { position: absolute; left: 72px; top: 58px; right: 72px; }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 42px; height: 42px; flex: none; }
  .brand .name { font-size: 25px; font-weight: 700; line-height: 1.05; }
  .brand .line { font: 500 12px/1.4 "IBM Plex Mono", monospace; letter-spacing: 0.14em;
                 text-transform: uppercase; color: var(--muted); margin-top: 3px; }

  h1 { margin-top: 30px; font-size: 56px; font-weight: 700; line-height: 1.04;
       letter-spacing: -0.02em; }
  h1 .gold { color: var(--gold); }
  .tagline { margin-top: 16px; font-size: 21px; color: var(--muted); }

  /* the measured facts, in the mono the project uses for numbers */
  .stats { position: absolute; left: 72px; bottom: 330px; display: flex; gap: 12px; }
  .stats span {
    font: 500 14px/1 "IBM Plex Mono", monospace; letter-spacing: 0.02em;
    color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 13px; background: rgba(255,255,255,0.03);
  }
  .stats b { color: var(--gold); font-weight: 600; }

  /* the bank, full width along the bottom, scaled down so every wire stays sharp */
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 294px; overflow: hidden; }
  .band img { position: absolute; left: 50%; transform: translateX(-50%);
              width: 1809px; height: 294px; display: block; }
  .band::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
                  background: var(--gold); z-index: 2; }
  /* the two ends fade into the card so the crop does not read as a cut */
  .band::after { content: ""; position: absolute; inset: 0; z-index: 1;
                 background: linear-gradient(90deg, var(--ink) 0%, transparent 14%,
                             transparent 86%, var(--ink) 100%); }
  .caption {
    position: absolute; right: 76px; bottom: 18px; z-index: 3;
    font: 500 12.5px/1 "IBM Plex Mono", monospace; color: var(--muted);
    background: rgba(7,6,10,0.78); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 11px;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <!-- a block of memory cells, one of them picked out -->
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="6" fill="#111018" stroke="#f6f3ec" stroke-width="2"/>
        <g fill="#5b6a8c">
          <rect x="7" y="7" width="6" height="11"/><rect x="15" y="7" width="6" height="11"/>
          <rect x="27" y="7" width="6" height="11"/>
          <rect x="7" y="22" width="6" height="11"/><rect x="15" y="22" width="6" height="11"/>
          <rect x="27" y="22" width="6" height="11"/>
        </g>
        <rect x="23" y="7" width="2" height="26" fill="#8fb8a6"/>
        <rect x="15" y="7" width="6" height="11" fill="#e0a93a"/>
      </svg>
      <div>
        <div class="name">sramforge</div>
        <div class="line">open source, every step</div>
      </div>
    </div>

    <h1>A memory compiler for a <span class="gold">7&nbsp;nanometre</span> process</h1>
    <p class="tagline">Three parameters in, a verified memory macro out.</p>
  </div>

  <div class="stats">
    <span><b>1.94</b> gigahertz</span>
    <span><b>114,454</b> transistors accounted for</span>
    <span><b>1 to 8</b> kilobytes</span>
  </div>

  <div class="band">
    <img src="../images/bank_wide.png" alt="">
    <div class="caption">a generated bank, as laid out</div>
  </div>
</body>
</html>
