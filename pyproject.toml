[project]
name = "sramforge"
version = "0.1.0"
description = "Single-port SRAM (Static Random-Access Memory) compiler for the ASAP7 (Arizona State Predictive Process Design Kit, 7 nanometre) process, built with open-source tools only"
requires-python = ">=3.10"
dependencies = ["klayout>=0.29"]

[project.scripts]
sramforge = "sramforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
